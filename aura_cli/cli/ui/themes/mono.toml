[metadata]
name = "mono"
version = "2.0.0"
author = "Aura CLI Team"
description = "Strict monochrome theme for purists and accessibility"

[colors]
primary = "white"
secondary = "grey70"
accent = "grey85"
success = "white"
warning = "grey85"
error = "grey70"
info = "grey85"
background = "#000000"
surface = "#0a0a0a"
muted = "grey42"
highlight = "white"
foreground = "grey70"
foreground_muted = "grey42"
foreground_bright = "white"

[styles]
title = "bold white"
subtitle = "bold grey70"
body = "grey70"
label = "grey42"
caption = "dim grey30"
code = "grey85"
status_idle = "grey50"
status_thinking = "grey70"
status_working = "white"
status_success = "white"
status_error = "grey50"
status_warning = "grey70"
loading = "grey42"
spinner = "white"
progress = "grey50"
agent_agi = "bold white"
agent_ops = "bold grey85"
agent_chat = "bold grey70"
link = "white"
link_hover = "bold white"
selected = "bold white"
focused = "white"
disabled = "grey30"

[borders]
border_primary = "grey42"
border_secondary = "grey30"
border_success = "grey50"
border_warning = "grey46"
border_error = "grey38"
border_muted = "grey23"
border_accent = "grey50"
border_focus = "white"

[layout]
panel_padding = [ 1, 2,]
chat_padding = [ 0, 1,]
chat_margin = [ 0, 0, 1, 0,]
chat_width_ratio = 0.85
lcd_padding = [ 0, 0,]
dialog_padding = [ 1, 2,]
compact_padding = [ 0, 1,]

[appearance]
panel_border_type = "heavy"
syntax_theme = "bw"
animate_spinners = true
glow_enabled = false
show_timestamps = true

[icons]
status_success = "[OK]"
status_error = "[!!]"
status_warning = "[!]"
status_info = "[i]"
status_pending = "[ ]"
status_active = "[*]"
file_default = "[-]"
file_folder = "[+]"
arrow_right = ">"
arrow_down = "v"
spinner_frames = [ "|", "/", "-", "\\",]

[syntax]
keyword = "white"
string = "grey85"
number = "grey70"
comment = "grey42"
function = "white"
variable = "grey70"
type = "grey85"
operator = "white"
constant = "grey85"

[markdown]
heading_1 = "bold white"
heading_2 = "bold grey85"
heading_3 = "bold white"
heading_4 = "grey85"
heading_5 = "dim grey85"
heading_6 = "dim grey85"
code = "bold grey85 on #0a0a0a"
code_block = "bold grey85"
link = "underline grey70"
strong = "bold white"
emphasis = "italic grey85"
blockquote = "dim grey70"
list_bullet = "white"
list_number = "white"
table_header = "bold white"
table_border = "grey42"
