[metadata]
name = "dark"
version = "2.0.0"
author = "Aura CLI Team"
description = "Clean, modern dark theme with high readability"

[colors]
primary = "#58a6ff"
secondary = "#8b949e"
accent = "#79c0ff"
success = "#3fb950"
warning = "#d29922"
error = "#f85149"
info = "#58a6ff"
background = "#0d1117"
surface = "#161b22"
muted = "#484f58"
highlight = "#58a6ff"
background_alt = "#010409"
surface_bright = "#21262d"
foreground = "#c9d1d9"
foreground_muted = "#8b949e"
foreground_bright = "#f0f6fc"
blue = "#58a6ff"
green = "#3fb950"
yellow = "#d29922"
orange = "#db6d28"
red = "#f85149"
purple = "#a371f7"
pink = "#db61a2"
cyan = "#76e3ea"

[styles]
title = "bold #f0f6fc"
subtitle = "bold #c9d1d9"
body = "#c9d1d9"
label = "#8b949e"
caption = "dim #6e7681"
code = "#79c0ff"
status_idle = "#484f58"
status_thinking = "#a371f7"
status_working = "#58a6ff"
status_success = "#3fb950"
status_error = "#f85149"
status_warning = "#d29922"
loading = "#58a6ff"
spinner = "#a371f7"
progress = "#3fb950"
agent_agi = "bold #a371f7"
agent_ops = "bold #58a6ff"
agent_chat = "bold #3fb950"
link = "#58a6ff"
link_hover = "#79c0ff"
selected = "bold #58a6ff"
focused = "#58a6ff"
disabled = "#484f58"

[borders]
border_primary = "#30363d"
border_secondary = "#21262d"
border_success = "#3fb950"
border_warning = "#d29922"
border_error = "#f85149"
border_muted = "#21262d"
border_accent = "#58a6ff"
border_focus = "#58a6ff"

[layout]
panel_padding = [ 1, 2,]
chat_padding = [ 0, 1,]
chat_margin = [ 0, 0, 1, 0,]
chat_width_ratio = 0.85
lcd_padding = [ 0, 0,]
dialog_padding = [ 1, 2,]
compact_padding = [ 0, 1,]

[appearance]
panel_border_type = "round"
syntax_theme = "github-dark"
animate_spinners = true
glow_enabled = false
show_timestamps = true

[icons]
status_success = "✓"
status_error = "✕"
status_warning = "!"
status_info = "i"
status_pending = "○"
status_active = "●"
file_default = "◇"
file_folder = "▢"
file_code = "◈"
arrow_right = "›"
arrow_down = "▾"
spinner_frames = [ "⠋", "⠙", "⠹", "⠸", "⠼", "⠴", "⠦", "⠧", "⠇", "⠏",]

[syntax]
keyword = "#ff7b72"
string = "#a5d6ff"
number = "#79c0ff"
comment = "#8b949e"
function = "#d2a8ff"
variable = "#ffa657"
type = "#79c0ff"
operator = "#ff7b72"
constant = "#79c0ff"

[markdown]
heading_1 = "bold #f0f6fc"
heading_2 = "bold #58a6ff"
heading_3 = "bold #79c0ff"
heading_4 = "#58a6ff"
heading_5 = "dim #58a6ff"
heading_6 = "dim #58a6ff"
code = "bold #79c0ff on #161b22"
code_block = "bold #79c0ff"
link = "underline #58a6ff"
strong = "bold #f0f6fc"
emphasis = "italic #79c0ff"
blockquote = "dim #58a6ff"
list_bullet = "#58a6ff"
list_number = "#58a6ff"
table_header = "bold #58a6ff"
table_border = "#30363d"
