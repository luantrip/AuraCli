[metadata]
name = "cyberpunk"
version = "2.0.0"
author = "Aura CLI Team"
description = "Classic high-contrast cyberpunk terminal aesthetic"

[colors]
primary = "cyan"
secondary = "magenta"
accent = "bright_green"
success = "bright_green"
warning = "bright_yellow"
error = "bright_red"
info = "bright_blue"
background = "#000000"
surface = "#121212"
muted = "grey50"
highlight = "bright_white"
foreground = "white"
foreground_muted = "grey50"
foreground_bright = "bright_white"

[styles]
title = "bold cyan"
subtitle = "bold magenta"
body = "white"
label = "grey50"
caption = "dim white"
code = "bright_green"
status_idle = "grey50"
status_thinking = "magenta"
status_working = "cyan"
status_success = "bright_green"
status_error = "bright_red"
status_warning = "bright_yellow"
loading = "cyan"
spinner = "bright_magenta"
progress = "green"
agent_agi = "bold magenta"
agent_ops = "bold cyan"
agent_chat = "bold green"
link = "cyan"
link_hover = "bright_cyan"
selected = "bold cyan"
focused = "cyan"
disabled = "grey30"

[borders]
border_primary = "cyan"
border_secondary = "magenta"
border_success = "bright_green"
border_warning = "bright_yellow"
border_error = "bright_red"
border_muted = "grey30"
border_accent = "bright_white"
border_focus = "cyan"

[layout]
panel_padding = [ 1, 2,]
chat_padding = [ 0, 1,]
chat_margin = [ 0, 0, 1, 0,]
chat_width_ratio = 0.85
lcd_padding = [ 0, 0,]
dialog_padding = [ 1, 2,]
compact_padding = [ 0, 1,]

[appearance]
panel_border_type = "round"
syntax_theme = "monokai"
animate_spinners = true
glow_enabled = false
show_timestamps = true

[icons]
status_success = "✔"
status_error = "✖"
status_warning = "▲"
status_info = "ℹ"
status_pending = "○"
status_active = "●"
spinner_frames = [ "⠋", "⠙", "⠹", "⠸", "⠼", "⠴", "⠦", "⠧", "⠇", "⠏",]

[syntax]
keyword = "magenta"
string = "green"
number = "cyan"
comment = "grey50"
function = "bright_cyan"
variable = "white"
type = "bright_magenta"
operator = "bright_white"
constant = "bright_yellow"

[markdown]
heading_1 = "bold cyan"
heading_2 = "bold bright_green"
heading_3 = "bold cyan"
heading_4 = "bright_green"
heading_5 = "dim bright_green"
heading_6 = "dim bright_green"
code = "bold bright_green on #121212"
code_block = "bold bright_green"
link = "underline bright_green"
strong = "bold cyan"
emphasis = "italic bright_green"
blockquote = "dim bright_green"
list_bullet = "cyan"
list_number = "cyan"
table_header = "bold cyan"
table_border = "grey50"
