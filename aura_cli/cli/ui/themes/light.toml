[metadata]
name = "light"
version = "2.0.0"
author = "Aura CLI Team"
description = "Clean, professional light theme for bright environments"

[colors]
primary = "#0969da"
secondary = "#57606a"
accent = "#0550ae"
success = "#1a7f37"
warning = "#9a6700"
error = "#cf222e"
info = "#0969da"
background = "#ffffff"
surface = "#f6f8fa"
muted = "#8c959f"
highlight = "#0969da"
background_alt = "#f6f8fa"
surface_bright = "#ffffff"
foreground = "#1f2328"
foreground_muted = "#57606a"
foreground_bright = "#1f2328"
blue = "#0969da"
green = "#1a7f37"
yellow = "#9a6700"
orange = "#bc4c00"
red = "#cf222e"
purple = "#8250df"
pink = "#bf3989"
cyan = "#0550ae"

[styles]
title = "bold #1f2328"
subtitle = "bold #57606a"
body = "#1f2328"
label = "#57606a"
caption = "dim #8c959f"
code = "#0550ae"
status_idle = "#8c959f"
status_thinking = "#8250df"
status_working = "#0969da"
status_success = "#1a7f37"
status_error = "#cf222e"
status_warning = "#9a6700"
loading = "#0969da"
spinner = "#8250df"
progress = "#1a7f37"
agent_agi = "bold #8250df"
agent_ops = "bold #0969da"
agent_chat = "bold #1a7f37"
link = "#0969da"
link_hover = "#0550ae"
selected = "bold #0969da"
focused = "#0969da"
disabled = "#8c959f"

[borders]
border_primary = "#d0d7de"
border_secondary = "#d8dee4"
border_success = "#1a7f37"
border_warning = "#9a6700"
border_error = "#cf222e"
border_muted = "#eaeef2"
border_accent = "#0969da"
border_focus = "#0969da"

[layout]
panel_padding = [ 1, 2,]
chat_padding = [ 0, 1,]
chat_margin = [ 0, 0, 1, 0,]
chat_width_ratio = 0.85
lcd_padding = [ 0, 0,]
dialog_padding = [ 1, 2,]
compact_padding = [ 0, 1,]

[appearance]
panel_border_type = "round"
syntax_theme = "github-light"
animate_spinners = true
glow_enabled = false
show_timestamps = true

[icons]
status_success = "✓"
status_error = "✕"
status_warning = "!"
status_info = "i"
status_pending = "○"
status_active = "●"
file_default = "◇"
file_folder = "▢"
file_code = "◈"
arrow_right = "›"
arrow_down = "▾"
spinner_frames = [ "⠋", "⠙", "⠹", "⠸", "⠼", "⠴", "⠦", "⠧", "⠇", "⠏",]

[syntax]
keyword = "#cf222e"
string = "#0a3069"
number = "#0550ae"
comment = "#8c959f"
function = "#8250df"
variable = "#953800"
type = "#0550ae"
operator = "#cf222e"
constant = "#0550ae"

[markdown]
heading_1 = "bold #1f2328"
heading_2 = "bold #0969da"
heading_3 = "bold #0550ae"
heading_4 = "#0969da"
heading_5 = "dim #0969da"
heading_6 = "dim #0969da"
code = "bold #0550ae on #f6f8fa"
code_block = "bold #0550ae"
link = "underline #0969da"
strong = "bold #1f2328"
emphasis = "italic #0969da"
blockquote = "dim #0969da"
list_bullet = "#0969da"
list_number = "#0969da"
table_header = "bold #0969da"
table_border = "#d0d7de"
