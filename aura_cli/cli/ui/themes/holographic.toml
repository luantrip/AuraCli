[metadata]
name = "holographic"
version = "2.0.0"
author = "Aura CLI Team"
description = "Futuristic holographic display with neon glow effects"

[colors]
primary = "#00ffff"
secondary = "#ff00ff"
accent = "#00ff88"
success = "#00ff88"
warning = "#ffaa00"
error = "#ff0044"
info = "#00ccff"
background = "#0a0a0f"
surface = "#0f1020"
muted = "#334455"
highlight = "#ffffff"
background_deep = "#050508"
surface_bright = "#141428"
hologram_cyan = "#00ffff"
hologram_magenta = "#ff00ff"
hologram_green = "#00ff88"
hologram_amber = "#ffaa00"
hologram_violet = "#aa88ff"
hologram_pink = "#ff88cc"
hologram_blue = "#0088ff"
hologram_red = "#ff0044"
glow_cyan = "#00ffff"
glow_magenta = "#ff00ff"
glow_green = "#00ff88"
scanline_bright = "#00ffff"
scanline_dim = "#003344"

[styles]
title = "bold #00ffff"
subtitle = "bold #ff00ff"
body = "#c0e0ff"
label = "#557799"
caption = "dim italic #8899aa"
code = "#00ff88"
status_idle = "#557799"
status_thinking = "#ff00ff"
status_working = "#00ffff"
status_success = "#00ff88"
status_error = "#ff0044"
status_warning = "#ffaa00"
status_scanning = "#ff00ff"
status_watching = "#00ff88"
loading = "#00ffff"
spinner = "#ff00ff"
progress = "#00ff88"
scanline = "dim #00ffff"
agent_agi = "bold #ff00ff"
agent_ops = "bold #00ffff"
agent_chat = "bold #00ff88"
imag_file = "#00ffff"
imag_dir = "#ff00ff"
imag_code = "#00ff88"
imag_config = "#ffaa00"
imag_doc = "#aa88ff"
imag_data = "#ff88cc"
link = "#00ffff"
link_hover = "#88ffff"
selected = "bold #00ffff"
focused = "#00ffff"
disabled = "#334455"
user_message = "#00ffff"
assistant_message = "#ff00ff"
system_message = "#557799"

[borders]
border_primary = "#00ffff"
border_secondary = "#ff00ff"
border_success = "#00ff88"
border_warning = "#ffaa00"
border_error = "#ff0044"
border_muted = "#223344"
border_accent = "#00ff88"
border_glow = "#00ffff"
border_focus = "#ff00ff"

[layout]
panel_padding = [ 1, 2,]
chat_padding = [ 0, 1,]
chat_margin = [ 0, 0, 1, 0,]
chat_width_ratio = 0.85
lcd_padding = [ 0, 0,]
dialog_padding = [ 1, 2,]
compact_padding = [ 0, 1,]

[appearance]
panel_border_type = "double"
syntax_theme = "monokai"
glow_enabled = true
scanline_effect = true
pulse_effect = true
flicker_effect = false
animate_spinners = true
show_timestamps = true

[animations]
scan_speed = 100
pulse_speed = 1000
glow_intensity = 0.5
scanline_opacity = 0.1

[icons]
status_success = "◈"
status_error = "✖"
status_warning = "▲"
status_info = "◉"
status_pending = "○"
status_active = "◉"
file_default = "○"
file_folder = "▣"
file_code = "◈"
file_config = "◉"
file_image = "◎"
file_binary = "◆"
file_other = "○"
folder = "▣"
folder_open = "▢"
action_add = "+"
action_remove = "−"
action_edit = "◇"
action_search = "○"
action_refresh = "↻"
arrow_right = "▸"
arrow_down = "▾"
arrow_left = "◂"
arrow_up = "▴"
spinner_frames = [ "⠋", "⠙", "⠹", "⠸", "⠼", "⠴", "⠦", "⠧", "⠇", "⠏",]

[syntax]
keyword = "#ff00ff"
string = "#00ff88"
number = "#ffaa00"
comment = "#557799"
function = "#00ffff"
variable = "#c0e0ff"
type = "#aa88ff"
operator = "#ff88cc"
constant = "#ffaa00"

[markdown]
heading_1 = "bold #00ffff"
heading_2 = "bold #ff00ff"
heading_3 = "bold #00ffff"
heading_4 = "#ff00ff"
heading_5 = "dim #ff00ff"
heading_6 = "dim #ff00ff"
code = "bold #00ff88 on #0a0a0a"
code_block = "bold #00ff88"
link = "underline #00ffff"
strong = "bold #00ffff"
emphasis = "italic #ff00ff"
blockquote = "dim #00ffff"
list_bullet = "#00ffff"
list_number = "#00ffff"
table_header = "bold #00ffff"
table_border = "#557799"
